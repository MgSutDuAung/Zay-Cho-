<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zay Cho Food Delivery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS Section - Design ပိုင်း */
        :root {
            --primary-blue: #003399; /* အပြာရောင်နောက်ခံ */
            --white: #ffffff; /* အဖြူရောင် Card များ */
            --accent: #ff9800; /* လိမ္မော်ရောင် Highlight */
            --light-bg: #eef2f7;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--primary-blue);
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
        }

        /* Welcome Screen (နာမည်/ဖုန်း/Location ယူရန်) */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 85%;
            max-width: 400px;
            text-align: center;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
        }

        /* Header */
        header {
            background: var(--white);
            text-align: center;
            padding: 20px;
            border-bottom: 5px solid var(--accent);
            border-radius: 0 0 25px 25px;
        }

        /* Menu Display */
        .container {
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }

        .category-title {
            color: white;
            margin: 25px 0 15px;
            font-size: 1.3rem;
            border-left: 5px solid var(--accent);
            padding-left: 10px;
        }

        .menu-item {
            background: var(--white);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .menu-item img {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 15px;
        }

        .item-detail { flex: 1; }
        .item-detail h3 { margin: 0; font-size: 1rem; color: #333; }
        .item-detail p { margin: 5px 0; color: var(--primary-blue); font-weight: bold; }

        .add-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Cart & Footer */
        .cart-bar {
            position: fixed;
            bottom: 20px; right: 20px;
            background: var(--accent);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 100;
        }

        .cart-panel {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: white;
            border-radius: 30px 30px 0 0;
            padding: 25px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
            display: none;
            box-sizing: border-box;
            z-index: 1500;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .qty-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-qty {
            background: #eee;
            border: none;
            width: 25px; height: 25px;
            border-radius: 5px;
        }

        .btn-order {
            background: #28a745;
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            margin-top: 15px;
            font-weight: bold;
        }

        .trash-btn { color: #ff4444; margin-left: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2 style="color: var(--primary-blue);">Zay Cho Delivery</h2>
            <p>ပို့ဆောင်ရန် အချက်အလက်ဖြည့်ပါ</p>
            <input type="text" id="cus-name" placeholder="သင့်နာမည်">
            <input type="tel" id="cus-phone" placeholder="သင့်ဖုန်းနံပါတ်">
            <button class="btn-order" onclick="getGPS()">တည်နေရာရယူပြီး စတင်မည်</button>
        </div>
    </div>

    <header>
        <h1 style="margin:0; font-size: 1.8rem; color: var(--primary-blue);">ZAY CHO</h1>
        <p style="margin:5px 0 0; color: #666;">Fast & Reliable Food Service</p>
    </header>

    <div class="container">
        <h2 class="category-title">နံနက်စာ</h2>
        <div class="menu-item">
            <img src="https://i.postimg.cc/fRFpL499/mohinga.jpg" alt="မုန့်ဟင်းခါး">
            <div class="item-detail">
                <h3>မုန့်ဟင်းခါး (အကြော်စုံ)</h3>
                <p>3,000 ကျပ်</p>
            </div>
            <button class="add-btn" onclick="addToCart('မုန့်ဟင်းခါး', 3000)">+</button>
        </div>

        <div class="menu-item">
            <img src="https://via.placeholder.com/100" alt="အုန်းနို့ခေါက်ဆွဲ">
            <div class="item-detail">
                <h3>အုန်းနို့ခေါက်ဆွဲ</h3>
                <p>2,000 ကျပ်</p>
            </div>
            <button class="add-btn" onclick="addToCart('အုန်းနို့ခေါက်ဆွဲ', 2000)">+</button>
        </div>

        <h2 class="category-title">ရှမ်းရိုးရာမီနူး</h2>
        <div class="menu-item">
            <img src="https://via.placeholder.com/100" alt="ရှမ်းခေါက်ဆွဲ">
            <div class="item-detail">
                <h3>ရှမ်းခေါက်ဆွဲ (အရည်/အသုတ်)</h3>
                <p>3,000 ကျပ်</p>
            </div>
            <button class="add-btn" onclick="addToCart('ရှမ်းခေါက်ဆွဲ', 3000)">+</button>
        </div>
    </div>

    <div class="cart-bar" onclick="showCart()">
        <i class="fas fa-shopping-basket"></i> ခြင်းတောင်း (<span id="count">0</span>)
    </div>

    <div id="cart-panel" class="cart-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>ရွေးချယ်ထားသော စာရင်း</h3>
            <span onclick="hideCart()" style="font-size:2rem; cursor:pointer;">&times;</span>
        </div>
        <div id="cart-list"></div>
        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.2rem; margin:15px 0;">
            <span>စုစုပေါင်း:</span>
            <span><span id="total">0</span> ကျပ်</span>
        </div>
        
        <select id="pay-style" style="width:100%; padding:10px; border-radius:10px; margin-bottom:10px;">
            <option value="Cash on Delivery">အိမ်ရောက်မှငွေချေမည်</option>
            <option value="Wave Money">Wave Money (09662514508)</option>
        </select>

        <button class="btn-order" onclick="submitOrder()">အော်ဒါတင်မည် (Telegram)</button>
    </div>

    <script>
        // JavaScript Section - လုပ်ဆောင်ချက်ပိုင်း
        let cart = [];
        let userLocation = "";

        // 1. GPS တည်နေရာယူခြင်း
        function getGPS() {
            const name = document.getElementById('cus-name').value;
            const phone = document.getElementById('cus-phone').value;

            if(!name || !phone) { alert("နာမည်နှင့်ဖုန်း ဖြည့်ပါ"); return; }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    userLocation = `https://www.google.com/maps?q=${position.coords.latitude},${position.coords.longitude}`;
                    document.getElementById('login-screen').style.display = 'none';
                    alert("Location ရရှိပါပြီ။ စတင်မှာယူနိုင်ပါပြီ။");
                }, () => {
                    alert("Location ခွင့်ပြုချက် ပေးရပါမည်။");
                });
            }
        }

        // 2. ခြင်းတောင်းထဲထည့်ခြင်း
        function addToCart(name, price) {
            let item = cart.find(i => i.name === name);
            if(item) { item.qty++; } 
            else { cart.push({name, price, qty: 1}); }
            renderCart();
        }

        // 3. အရေအတွက် အတိုးအလျှော့ နှင့် ဖျက်ခြင်း
        function changeQty(name, delta) {
            let item = cart.find(i => i.name === name);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) cart = cart.filter(i => i.name !== name);
            }
            renderCart();
        }

        function deleteItem(name) {
            cart = cart.filter(i => i.name !== name);
            renderCart();
        }

        // 4. Cart ပြသခြင်း
        function renderCart() {
            const list = document.getElementById('cart-list');
            const totalText = document.getElementById('total');
            const countText = document.getElementById('count');
            
            list.innerHTML = "";
            let total = 0;
            let count = 0;

            cart.forEach(item => {
                total += (item.price * item.qty);
                count += item.qty;
                list.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <b>${item.name}</b><br>
                            <small>${item.price} ကျပ်</small>
                        </div>
                        <div class="qty-box">
                            <button class="btn-qty" onclick="changeQty('${item.name}', -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="btn-qty" onclick="changeQty('${item.name}', 1)">+</button>
                            <i class="fas fa-trash trash-btn" onclick="deleteItem('${item.name}')"></i>
                        </div>
                    </div>
                `;
            });
            totalText.innerText = total.toLocaleString();
            countText.innerText = count;
        }

        function showCart() { document.getElementById('cart-panel').style.display = 'block'; }
        function hideCart() { document.getElementById('cart-panel').style.display = 'none'; }

        // 5. Telegram သို့ ပို့ခြင်း
        function submitOrder() {
            if(cart.length === 0) return alert("ပစ္စည်းရွေးပါဦး");

            let name = document.getElementById('cus-name').value;
            let phone = document.getElementById('cus-phone').value;
            let pay = document.getElementById('pay-style').value;
            let itemsText = cart.map(i => `${i.name} - ${i.qty}ခု`).join('%0A');
            let total = document.getElementById('total').innerText;

            let text = `🛒 *New Order - Zay Cho*%0A%0A` +
                       `👤 နာမည်: ${name}%0A` +
                       `📞 ဖုန်း: ${phone}%0A` +
                       `🍱 မှာယူမှု: %0A${itemsText}%0A` +
                       `💰 စုစုပေါင်း: ${total} ကျပ်%0A` +
                       `💳 ငွေချေစနစ်: ${pay}%0A` +
                       `📍 တည်နေရာ: ${userLocation}`;

            const botToken = "8056079963:AAG1W-o7Y33F9ZqTiaMhWcl6l9XmZ9I94jY";
            const chatId = "6547610057";
            const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${text}&parse_mode=Markdown`;

            fetch(url).then(res => {
                if(res.ok) {
                    alert("အော်ဒါ ပို့ဆောင်ပြီးပါပြီ။ ခေတ္တစောင့်ဆိုင်းပေးပါ။");
                    cart = []; renderCart(); hideCart();
                }
            });
        }
    </script>
</body>
</html>
